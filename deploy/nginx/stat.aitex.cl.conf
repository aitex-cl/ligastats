# LigaStats - stat.aitex.cl (generado por instalar.sh; no afecta a voceo.aitex.cl)
limit_req_zone $binary_remote_addr zone=ligastats_mcp:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ligastats_web:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name stat.aitex.cl;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stat.aitex.cl;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/stat.aitex.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat.aitex.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ligastats_ssl:1m;

    access_log /var/log/nginx/stat.aitex.cl.access.log;
    error_log  /var/log/nginx/stat.aitex.cl.error.log;

    location /mcp {
        limit_req zone=ligastats_mcp burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # panel web (usuario y clave en la aplicación)
    location / {
        limit_req zone=ligastats_web burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
